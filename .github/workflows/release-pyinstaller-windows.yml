name: Build Windows release (PyInstaller)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.9.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build (onedir) + zip
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "val=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "val=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "val=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python -c "import json; print(json.load(open('version.json'))['version'])")
            echo "val=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/intenserp-next-v2-win32-x64.zip
          tag_name: ${{ steps.tag.outputs.val }}
          name: IntenseRP Next ${{ steps.tag.outputs.val }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
