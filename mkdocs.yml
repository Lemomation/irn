site_name: IntenseRP Next v2
site_description: Documentation for IntenseRP Next v2
# Read the Docs sets READTHEDOCS_CANONICAL_URL (includes /en/<version>/).
# Use a fallback so local builds still get a stable site_url.
site_url: https://lemomation.github.io/irn/
repo_name: Lemomation/irn
repo_url: https://github.com/Lemomation/irn
edit_uri: edit/v2-rewrite/docs/

# NOTE:
# DESPITE BEING CALLED mkdocs.yml,
# WE USE ZENSICAL FOR DOCS GENERATION.

nav:
  - Docs:
      - Home: index.md
      - News: news.md
      - Getting Started: getting-started.md
      - Glossary: glossary.md
      - Migration Guide: migration.md
      - Features:
          - Overview: features.md
          - Accounts & Credentials: features/accounts.md
          - Formatting: features/formatting.md
          - Multi-Slot Cache: features/multi-slot-cache.md
          - Chat Auto-Deletion: features/chat-auto-deletion.md
          - STMP Support: features/stmp-support.md
          - Login & Sessions: features/login-sessions.md
          - Network & API: features/network-api.md
          - Universal Model Names: features/universal-model-names.md
          - Console & Logging: features/console-logging.md
          - Hotswaps: features/hotswaps.md
          - System: features/system.md
      - Providers:
          - Overview: providers.md
          - DeepSeek Behavior: providers/deepseek-behavior.md
          - GLM Behavior: providers/glm-behavior.md
          - Kimi Behavior: providers/moonshot-behavior.md
          - QwenLM Behavior: providers/qwen-behavior.md
          - Perplexity Behavior: providers/perplexity-behavior.md
          - HuggingChat Behavior: providers/huggingchat-behavior.md
          - Google AI Studio Behavior: providers/aistudio-behavior.md
          - Xiaomi MiMo Behavior: providers/mimo-behavior.md
      - Browser & Runtime:
          - Overview: runtime.md
          - Browser Installation: runtime/browser-installation.md
          - Browser Environment: runtime/browser-environment.md
          - Providers in Parallel: runtime/providers-in-parallel.md
          - Provider Stability: runtime/provider-stability.md
      - Experimental:
          - Overview: experimental.md
          - Loadouts: experimental/loadouts.md
          - Remote Control: experimental/remote-control.md
      - Advanced:
          - Overview: advanced.md
          - Provider Support: advanced/provider-support.md
          - API Behavior: advanced/api-behavior.md
          - IP Whitelist: advanced/ip-whitelist.md
          - GLM Quirks: advanced/glm-quirks.md
          - App Flags: advanced/app-flags.md
      - Util Reference:
          - Overview: util-reference.md
          - Help & Extras: util-reference/help-extras.md
          - Bug Report: util-reference/bug-report.md
          - Backup & Import Settings: util-reference/backup-import-settings.md
          - Browser Manager: util-reference/browser-manager.md
          - STMP Patcher: util-reference/stmp-patcher.md
          - Contributors: util-reference/contributors.md
      - Help & Support:
          - Troubleshooting: hands/troubleshooting.md
          - Contact: hands/contact.md
          - Project Status: hands/support.md
          - FAQ: hands/faq.md
  - Community:
      - Get Involved: community.md
  - Vote for New Stuff:
      - vote-for-new-stuff.md

theme:
  name: material
  variant: modern
  custom_dir: overrides
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - navigation.top
    - content.action.edit
    - content.action.view
    - content.code.copy

plugins:
  - search
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      exclude:
        - index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

extra_css:
  - stylesheets/extra.css
